name: MSV Dashboard aktualisieren

on:
  schedule:
    - cron: "23 4,16 * * *"   # taeglich ca. 5:23 und 17:23 Uhr (Winterzeit), 6:23 und 18:23 (Sommerzeit)
  workflow_dispatch: {}        # Knopf "Run workflow" zum Starten von Hand

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: msv-dashboard
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    outputs:
      seite: ${{ steps.hochladen.outcome }}
      polar_fehler: ${{ steps.polar.outputs.fehler }}
      skillcorner_fehler: ${{ steps.skillcorner.outputs.fehler }}
      liga_fehler: ${{ steps.liga.outputs.fehler }}
    env:
      ZUSTAND_SCHLUESSEL: ${{ secrets.ZUSTAND_SCHLUESSEL }}
      MSV_PW: ${{ secrets.DASHBOARD_PASSWORT }}
      POLAR_CLIENT_ID: ${{ secrets.POLAR_CLIENT_ID }}
      POLAR_CLIENT_SECRET: ${{ secrets.POLAR_CLIENT_SECRET }}
      POLAR_REFRESH_TOKEN: ${{ secrets.POLAR_REFRESH_TOKEN }}
      MSV_TOKEN_DATEI: 02_Daten/polar_token.txt
      SKILLCORNER_USER: ${{ secrets.SKILLCORNER_USER }}
      SKILLCORNER_PW: ${{ secrets.SKILLCORNER_PASSWORT }}
      NOTIZEN_TOKEN: ${{ secrets.NOTIZEN_TOKEN }}
      NOTIZEN_REPO: justusboev/msv-notizen
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Werkzeuge installieren
        run: pip install cryptography

      - name: Datenstand entschluesseln
        run: python 03_Skripte/zustand.py auspacken

      - name: Kader und Spielerfotos entschluesseln
        run: python 03_Skripte/zustand.py stammdaten-auspacken

      - name: Impect-Daten entschluesseln
        run: python 03_Skripte/zustand.py impect-auspacken

      - name: Trainings von Polar holen
        id: polar
        run: |
          mkdir -p 04_Tests 01_Dashboard
          set +e
          python 03_Skripte/polar_abholen.py --auto
          rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 10 ]; then echo "fehler=1" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Spiele von SkillCorner holen
        id: skillcorner
        run: |
          if [ -z "$SKILLCORNER_PW" ]; then echo "Kein SkillCorner-Zugang hinterlegt, uebersprungen."; exit 0; fi
          set +e
          cd 03_Skripte
          python skillcorner_abholen.py --auto --ohne-events
          rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 10 ]; then echo "fehler=1" >> "$GITHUB_OUTPUT"; fi
          python daten_zusammenfuehren.py
          exit 0

      - name: Liga von SkillCorner holen und auswerten
        id: liga
        run: |
          if [ -z "$SKILLCORNER_PW" ]; then echo "Kein SkillCorner-Zugang hinterlegt, uebersprungen."; exit 0; fi
          set +e
          python 03_Skripte/liga_abholen.py --nur-neu
          rc=$?
          if [ $rc -ne 0 ] && [ $rc -ne 10 ]; then echo "fehler=1" >> "$GITHUB_OUTPUT"; fi
          python 03_Skripte/liga_auswerten.py || echo "fehler=1" >> "$GITHUB_OUTPUT"
          python 03_Skripte/liga_aufstellungen.py || echo "fehler=1" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Dashboard bauen
        run: |
          mkdir -p seite
          python 03_Skripte/html_mit_passwort_bauen.py 02_Daten/skillcorner_physis_alle_spiele.csv seite/index.html

      - name: Datenstand verschluesselt sichern
        if: always()
        run: |
          python 03_Skripte/zustand.py einpacken
          git config user.name "MSV Dashboard"
          git config user.email "actions@users.noreply.github.com"
          git add daten/zustand.enc daten/zustand.pruefsumme
          git diff --cached --quiet || (git commit -m "Datenstand $(date '+%d.%m.%Y %H:%M')" && git pull --rebase && git push)

      - uses: actions/upload-pages-artifact@v3
        id: hochladen
        with:
          path: seite

  # Eigener Job fuers Veroeffentlichen: GitHub braucht seit Nov. 2026 einen Moment,
  # bis das hochgeladene Seitenpaket auffindbar ist. Im selben Job schlug das fehl.
  veroeffentlichen:
    needs: aktualisieren
    if: always() && needs.aktualisieren.outputs.seite == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - name: Kurz warten
        run: sleep 20
      - name: Veroeffentlichen
        id: veroeffentlichen
        uses: actions/deploy-pages@v4

  melden:
    needs: [aktualisieren, veroeffentlichen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fehler melden
        if: needs.aktualisieren.outputs.polar_fehler == '1' || needs.aktualisieren.outputs.skillcorner_fehler == '1' || needs.aktualisieren.outputs.liga_fehler == '1' || needs.veroeffentlichen.result != 'success'
        run: |
          echo "Polar-Fehler: ${{ needs.aktualisieren.outputs.polar_fehler }}"
          echo "SkillCorner-Fehler: ${{ needs.aktualisieren.outputs.skillcorner_fehler }}"
          echo "Liga-Fehler: ${{ needs.aktualisieren.outputs.liga_fehler }}"
          echo "Veroeffentlichen: ${{ needs.veroeffentlichen.result }}"
          exit 1
